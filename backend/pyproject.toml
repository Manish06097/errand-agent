[project]
name = "errand"
version = "0.0.0"
description = "Errand agent: backend API and mock provider world"
requires-python = "==3.11.*"
# Exact pins. The LangGraph and LangChain versions match the spike venvs in
# spikes/, so the behaviours the design relies on are the ones we measured.
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core==1.7.6",
  "langchain-anthropic==1.7.10",
  "aiosqlite==0.22.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  # Optional Langfuse dashboard (ADR 0008), same pins as spikes/langfuse. Imported
  # only by errand.trace.sinks.langfuse, and only when keys are set.
  "langfuse==5.2.0",
  "opentelemetry-sdk==1.45.2",
]

[project.scripts]
errand-api = "errand.api.app:main"
errand-world = "errand.world.server:main"
errand-trace = "errand.trace.cli:main"

[dependency-groups]
dev = [
  "ruff==0.17.4",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "import-linter==2.15",
  "pre-commit==4.7.0",
  "types-pyyaml==6.0.12.20250915",
  "hypothesis==6.170.8",
  "pytest-xdist==3.8.0",
]

[build-system]
requires = ["uv_build==0.9.28"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Paths are relative to this file so mypy behaves the same from the repo root
# (make check, pre-commit) and from backend/.
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR",
  "$MYPY_CONFIG_FILE_DIR/../scripts",
]
files = [
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR/tests",
  "$MYPY_CONFIG_FILE_DIR/evals",
  "$MYPY_CONFIG_FILE_DIR/../scripts",
]
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

# The consequential and provider-facing code gets the strictest checks. These are
# the flags --strict enables, spelled out: mypy 2.4 applies `strict = true` inside
# an override to every module, not just the ones listed.
[[tool.mypy.overrides]]
module = [
  "errand.approvals", "errand.approvals.*",
  "errand.execution", "errand.execution.*",
  "errand.world", "errand.world.*",
  "errand.tools", "errand.tools.*",
  "errand.clock",
  "errand.store", "errand.store.*",
  "errand.trace", "errand.trace.*",
  "errand.llm", "errand.llm.*",
  "errand.usage",
  "errand.quarantine", "errand.quarantine.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# An empty parametrize list is a collection error, not one skipped test that exits 0
# (BUG-M3-1: an empty scenario catalogue passed make evals that way).
empty_parameter_set_mark = "fail_at_collect"
markers = [
  "live: calls the real Claude API; skipped unless ERRAND_LIVE=1",
  "slow: starts a subprocess or a real server, or shells out to make or git; runs in the second pytest step of make check, on its own xdist workers",
]

[tool.importlinter]
root_package = "errand"
# Lets contracts name third-party packages; the Langfuse contract below needs it.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the Langfuse sink imports langfuse or opentelemetry, so with Langfuse off neither is loaded by us"
type = "forbidden"
source_modules = ["errand"]
forbidden_modules = ["langfuse", "opentelemetry"]
ignore_imports = [
  "errand.trace.sinks.langfuse -> langfuse",
  "errand.trace.sinks.langfuse -> opentelemetry",
]

[[tool.importlinter.contracts]]
name = "Only the executor makes consequential calls: planner, model, context and reader code never import it"
type = "forbidden"
source_modules = [
  "errand.agent.nodes.plan",
  "errand.llm",
  "errand.context",
  "errand.quarantine",
]
forbidden_modules = ["errand.execution.executor"]

[[tool.importlinter.contracts]]
name = "The mock world never imports the agent"
type = "forbidden"
source_modules = ["errand.world"]
forbidden_modules = ["errand.agent"]

[[tool.importlinter.contracts]]
name = "The mock world imports nothing from the tool gateway, execution or the API (errand.clock is its only errand dependency)"
type = "forbidden"
source_modules = ["errand.world"]
forbidden_modules = [
  "errand.tools",
  "errand.execution",
  "errand.api",
  "errand.approvals",
  "errand.context",
  "errand.llm",
  "errand.quarantine",
  "errand.store",
  "errand.trace",
  "errand.usage",
  "errand.config",
]

[[tool.importlinter.contracts]]
name = "Foundations (store, trace, llm) never import the agent, the API, the world or the executor"
type = "forbidden"
source_modules = ["errand.store", "errand.trace", "errand.llm", "errand.usage"]
forbidden_modules = ["errand.agent", "errand.api", "errand.world", "errand.execution"]

[[tool.importlinter.contracts]]
name = "The model gateway uses the tracer, never the other way round; usage depends on neither"
type = "layers"
layers = ["errand.llm", "errand.trace", "errand.usage"]

[[tool.importlinter.contracts]]
name = "Agent, API, context and model code reach the world only through errand.tools (world.contracts types are fine)"
type = "forbidden"
source_modules = ["errand.agent", "errand.api", "errand.context", "errand.llm", "errand.quarantine"]
forbidden_modules = [
  "errand.world.engine",
  "errand.world.store",
  "errand.world.server",
  "errand.world.catalog",
]
# The tools package is the one sanctioned way in, and only through these two edges:
# the runtime builds the host and the in-process transport calls it. Any other tools
# module on a path from these sources to the engine, store, server or catalog fails.
ignore_imports = [
  "errand.tools.runtime -> errand.world.engine",
  "errand.tools.client -> errand.world.engine",
]

[[tool.importlinter.contracts]]
name = "Only the executor reaches book, cancel and reschedule (errand.tools.consequential)"
type = "forbidden"
# Everything except errand.execution.executor. A forbidden contract cannot name a
# parent of the forbidden module as a source, so errand.tools is listed module by
# module; tests/tools/test_consequential_boundary.py also scans the tree for importers.
source_modules = [
  "errand.agent",
  "errand.api",
  "errand.approvals",
  "errand.clock",
  "errand.config",
  "errand.context",
  "errand.domain",
  "errand.execution.idempotency",
  "errand.execution.intents",
  "errand.ids",
  "errand.llm",
  "errand.quarantine",
  "errand.store",
  "errand.tools.client",
  "errand.tools.errors",
  "errand.tools.gateway",
  "errand.tools.inspector",
  "errand.tools.runtime",
  "errand.tools.sanitize",
  "errand.tools.timeouts",
  "errand.tools.views",
  "errand.trace",
  "errand.usage",
  "errand.world",
]
forbidden_modules = ["errand.tools.consequential"]
# The executor is the one sanctioned importer; the nodes that call it (execute) reach
# the consequential module only through it.
ignore_imports = ["errand.execution.executor -> errand.tools.consequential"]
