[project]
name = "errand"
version = "0.0.0"
description = "Errand agent: backend API and mock provider world"
requires-python = "==3.11.*"
# Exact pins. The LangGraph and LangChain versions match the spike venvs in
# spikes/, so the behaviours the design relies on are the ones we measured.
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core==1.7.6",
  "langchain-anthropic==1.7.10",
  "aiosqlite==0.22.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
]

[project.scripts]
errand-api = "errand.api.app:main"
errand-world = "errand.world.server:main"

[dependency-groups]
dev = [
  "ruff==0.17.4",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "import-linter==2.15",
  "pre-commit==4.7.0",
  "httpx==0.28.1",
]

[build-system]
requires = ["uv_build==0.9.28"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Paths are relative to this file so mypy behaves the same from the repo root
# (make check, pre-commit) and from backend/.
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR",
  "$MYPY_CONFIG_FILE_DIR/../scripts",
]
files = [
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR/tests",
  "$MYPY_CONFIG_FILE_DIR/../scripts",
]
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

# The consequential and provider-facing code gets the strictest checks. These are
# the flags --strict enables, spelled out: mypy 2.4 applies `strict = true` inside
# an override to every module, not just the ones listed.
[[tool.mypy.overrides]]
module = [
  "errand.approvals", "errand.approvals.*",
  "errand.execution", "errand.execution.*",
  "errand.world", "errand.world.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: calls the real Claude API; skipped unless ERRAND_LIVE=1",
]

[tool.importlinter]
root_package = "errand"

[[tool.importlinter.contracts]]
name = "Only the executor makes consequential calls: planner, model, context and reader code never import it"
type = "forbidden"
source_modules = [
  "errand.agent.nodes.plan",
  "errand.llm",
  "errand.context",
  "errand.quarantine",
]
forbidden_modules = ["errand.execution.executor"]

[[tool.importlinter.contracts]]
name = "The mock world never imports the agent"
type = "forbidden"
source_modules = ["errand.world"]
forbidden_modules = ["errand.agent"]
