id: S05_day_change_while_a_card_is_pending
title: The user changes the day while an approval card is pending; the card is invalidated as request_changed, the old card and the old fingerprint both get 409, the status line says why, and only the new card books
category: [correction, changed slot]
seed: 5
world:
  book: {forced: [success]}
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings, budget_max_inr: "1500"}
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - expect_card: {kind: action, status: pending}
  - say: "Actually, Thursday or Friday works better for me, not before 10 a.m."
  - expect_outcome: PRESENTED_OPTIONS
  - expect_patch: {set: [window]}
  - expect_trace: {approval.invalidated: 1}
  - expect_approvals: ["invalidated:request_changed"]
  - expect_transcript:
      status_line_includes: ["out of date", "day", "Nothing was booked"]
      status_line_excludes: ["Booked:"]
  - expect_shortlist:
      window_label_includes: "Thu 12 Nov - Fri 13 Nov, 10:00-12:00"
      slot_weekdays: [4, 5]
      slot_hours: ["10:00", "12:00"]
  - approve: {card: original, expect_status: 409, expect_error: no_longer_valid}
  - expect_world: {book: 0}
  - click_slot: S1
  - expect_outcome: AWAITING_APPROVAL
  - expect_card: {kind: action, status: pending}
  - expect_approvals: ["invalidated:request_changed", "pending"]
  - approve: {card: original, expect_status: 409, expect_error: no_longer_valid}
  - approve: {fingerprint: stale, expect_status: 409, expect_error: details_changed}
  - expect_world: {book: 0}
  - approve: {}
  - expect_outcome: BOOKED_VERIFIED
  - expect_booking: {count: 1}
  - expect_world: {book: 1}
expect:
  invariants: [default]
