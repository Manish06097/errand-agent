id: S55_book_it_during_requote
title: '"book it" typed while a refresh re-holds at a higher price never binds to the new card: queued on the old card, composed before the request, or before the render'
category: [changed price after approval]
seed: 55
world:
  book: {forced: [success]}
  # every provider, so the scenario does not depend on who ranks first
  quote_drift: {mode: on_rehold, providers: {P1: 250, P2: 250, P3: 250, P4: 250, P5: 250, P6: 250, P7: 250, P8: 250, P9: 250, P10: 250, P11: 250, P12: 250, P13: 250, P14: 250, P15: 250, P16: 250, P17: 250, P18: 250, P19: 250, P20: 250}}
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings, budget_max_inr: "1500"}
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - advance: 11m
  - refresh_hold: {}
  - expect_outcome: AWAITING_APPROVAL
  - expect_card: {kind: action, status: pending, price_delta_inr: 250}
  - type_confirm: {text: "book it", composed_during_run: true, visible: at_send}
  - expect_outcome: AWAITING_APPROVAL
  - expect_trace: {approval.granted: 0}
  - advance: 11m
  - refresh_hold: {}
  - expect_card: {kind: action, status: pending, price_delta_inr: 250}
  - type_confirm: {text: "book it", composed_during_run: true, visible: latest, ack: early}
  - expect_outcome: AWAITING_APPROVAL
  - expect_trace: {approval.granted: 0}
  - type_confirm: {text: "book it", visible: latest, ack: late}
  - expect_outcome: AWAITING_APPROVAL
  - expect_trace: {approval.granted: 0}
  - expect_card: {kind: reminder, status: pending}
  - expect_world: {book: 0, hold_slot: 3}
expect:
  invariants: [default]
