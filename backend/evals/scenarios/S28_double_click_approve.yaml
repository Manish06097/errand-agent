id: S28_double_click_approve
title: Approve pressed twice at once; one grant, the second request gets 409, one consumed approval and one world booking
category: [repeated confirmation]
seed: 28
world:
  book: {forced: [success]}
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings, budget_max_inr: "1500"}
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - approve_concurrently: 2
  - expect_outcome: BOOKED_VERIFIED
  - expect_trace: {approval.consumed: 1, approval.granted: 1}
  - approve: {expect_status: 200}
  - expect_world: {book: 1}
  - expect_booking: {count: 1}
expect:
  invariants: [default]
