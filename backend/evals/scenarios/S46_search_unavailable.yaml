id: S46_search_unavailable
title: Provider search answers 503 (test-only fault); one retry, then TOOL_UNAVAILABLE with Retry
category: [tool failure]
seed: 46
faults:
  search_providers: 503
user:
  persona: cooperative
  goal:
    service: plumber
    area: Indiranagar
    window: this week mornings
    budget_max_inr: "1500"
steps:
  - say: "Find a plumber in Indiranagar this week, mornings, under ₹1,500."
    gives: [service, area, window, budget_max_inr]
  - expect_outcome: TOOL_UNAVAILABLE
  - expect_notice: retry
  - expect_tool_errors: {tool: search_providers, error: ToolTransient, count: 2}
  - expect_world: {search_providers: 2}
  - expect_search_matches_brief: {}
expect:
  invariants: [default]
