id: S19_hold_expires_after_grant_requote_higher
title: The hold lapses before the approval is acted on and the re-hold quotes higher; the approval is invalidated as price_changed, a new card is shown, and nothing is booked until the second grant
category: [changed_price_after_approval]
seed: 19
world:
  book: {forced: [success]}
  # every provider, so the scenario does not depend on who ranks first; only a second hold of the same slot drifts
  quote_drift: {mode: on_rehold, providers: {P1: 250, P2: 250, P3: 250, P4: 250, P5: 250, P6: 250, P7: 250, P8: 250, P9: 250, P10: 250, P11: 250, P12: 250, P13: 250, P14: 250, P15: 250, P16: 250, P17: 250, P18: 250, P19: 250, P20: 250}}
user:
  persona: cooperative
  goal:
    service: plumber
    area: Indiranagar
    window: this week mornings
    budget_max_inr: "1500"
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - expect_outcome: AWAITING_APPROVAL
  - advance: 11m
  - approve: {}
  - expect_outcome: AWAITING_APPROVAL
  - expect_trace: {approval.invalidated: 1, approval.hold_rebound: 0, approval.consumed: 0, approval.requested: 1}
  - expect_transcript: {includes: ["the price changed", "nothing was booked"]}
  - expect_card: {kind: action, status: pending, price_delta_inr: 250}
  - expect_world: {hold_slot: 2, book: 0}
  - expect_booking: {count: 0}
  - approve: {}
  - expect_outcome: BOOKED_VERIFIED
  - expect_world: {hold_slot: 2, book: 1}
  - expect_booking: {count: 1, price_is_held_quote: true}
expect:
  invariants: [default]
