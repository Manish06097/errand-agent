  quote_drift: {mode: on_hold, providers: {P1: 2000, P2: 2000, P3: 2000, P4: 2000, P5: 2000, P6: 2000, P7: 2000, P8: 2000, P9: 2000, P10: 2000, P11: 2000, P12: 2000, P13: 2000, P14: 2000, P15: 2000, P16: 2000, P17: 2000, P18: 2000, P19: 2000, P20: 2000}}
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings, budget_max_inr: "1500"}
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
