id: S31_slot_already_booked
title: A slot the user booked in another chat is refused by validation, from the planner and from a slot click; a same-day slot shows the booking on its card
category: [duplicates]
seed: 31
world:
  book: {forced: [success]}
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings, budget_max_inr: "1500"}
steps:
  - say: "Find a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - expect_outcome: PRESENTED_OPTIONS
  - conversation: second
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - approve: {}
  - expect_outcome: BOOKED_VERIFIED
  - conversation: main
  - say: "book S1"
  - expect_outcome: REPLIED
  - expect_trace: {guard.planner_tool_rejected: 1, approval.requested: 0}
  - click_slot: S1
  - expect_outcome: REPLIED
  - expect_trace: {approval.requested: 0}
  - click_slot: S4
  - expect_outcome: AWAITING_APPROVAL
  - expect_card: {kind: action, nearby: 1}
  - decline: {}
  - expect_outcome: DECLINED
  - expect_world: {book: 1}
  - expect_booking: {count: 1}
expect:
  invariants: [default]
