id: S44_loop_forever_policy
title: LoopForeverPolicy at the default limits; the 6 loop iterations bind, LIMIT_REACHED with a partial result and nothing booked
category: [limit exhaustion]
seed: 44
model: hostile:loop_forever
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings}
steps:
  - say: "Find a plumber in Indiranagar this week, mornings."
    gives: [service, area, window]
  - expect_outcome: LIMIT_REACHED
  - expect_limit: iterations
  - expect_transcript: {last_includes: ["So far I have: plumber, Indiranagar", "Nothing was booked"]}
  - expect_notice: retry
  - expect_world: {list_bookings: 5, hold_slot: 0, book: 0, cancel: 0, reschedule: 0}
  - expect_no_side_effects: {}
expect:
  invariants: [default]
