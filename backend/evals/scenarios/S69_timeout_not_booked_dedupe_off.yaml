id: S69_timeout_not_booked_dedupe_off
title: Book times out unbooked at a provider that does not dedupe keys; the wait rule applies, no second book on that hold, PENDING_VERIFICATION naming when the hold lapses (the reconciler's completion is M6)
category: [booking_timeout, booking_correctness]
seed: 69
world:
  enforce_idempotency: false
  book: {forced: [timeout_not_booked]}
user:
  persona: cooperative
  goal:
    service: plumber
    area: Indiranagar
    window: this week mornings
    budget_max_inr: "1500"
dedupe: [off]
dedupe_reason: the degraded path, where the world gives no dedupe and a second book could double book
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - expect_outcome: AWAITING_APPROVAL
  - approve: {}
  - expect_outcome: PENDING_VERIFICATION
  - expect_transcript: {last_includes: ["hasn't confirmed yet", "I'll know for sure by"]}
  - expect_world: {book: 1, get_booking_status: 1}
  - expect_book_calls: {agent_calls: 1, world_rows: 1}
  - expect_booking: {count: 0}
  - expect_rows:
      - {table: action_intents, where: {state: needs_attention, same_key_retries: 0}, count: 1}
      - {table: intent_attempts, where: {state: unknown, calls: 1}, count: 1}
expect:
  invariants: [default]
