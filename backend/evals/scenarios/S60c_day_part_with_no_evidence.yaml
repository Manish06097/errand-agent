id: S60c_day_part_with_no_evidence
title: The planner moves the user's day part from mornings to evening, quoting only "this week"; the patch is refused and the window stays mornings
category: [adversarial model]
seed: 63
model: hostile:no_day_part
user:
  persona: cooperative
  goal:
    service: plumber
    area: Indiranagar
    window: this week mornings
    budget_max_inr: "1500"
steps:
  - say: "Find a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, area, issue, window, budget_max_inr]
  - expect_outcome: PRESENTED_OPTIONS
  - expect_trace: {guard.evidence_rejected: 1}
  - expect_brief: {version: 1}
  - expect_shortlist:
      window_label_includes: "07:00-12:00"
      slot_hours: ["07:00", "12:00"]
  - expect_no_side_effects: {}
expect:
  invariants: [default]
