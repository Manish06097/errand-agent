id: S39_window_passes
title: Nobody acts on the Rebook card; when the replacement window's last day passes the watcher ends the job done (lapsed), invalidates the card with followup_expired and writes one line, with no second notification and no booking
category: [followup]
seed: 39
world:
  book: {forced: [success]}
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings, budget_max_inr: "1500"}
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - approve: {}
  - expect_outcome: BOOKED_VERIFIED
  - world_event: {type: provider_cancelled, booking: last_booked}
  - watcher_tick: {}
  - expect_notification: {count: 1, unread: 1}
  - open_followup: {}
  - expect_approvals: ["consumed", "pending"]
  # hold and approval lapse on their own; nothing re-searches, re-notifies or books
  - advance: 40m
  - watcher_tick: {}
  - expect_notification: {count: 1}
  - expect_world: {search_providers: 2, hold_slot: 2, book: 1}
  - advance: 100h
  - watcher_tick: {}
  - expect_outcome: REPLIED
  - expect_transcript: {last_includes: ["window for replacing", "stopped looking"]}
  - expect_notification: {count: 1, unread: 1}
  - expect_rows:
      - {table: followup_jobs, where: {state: done, done_reason: lapsed}, count: 1}
  - expect_world: {search_providers: 2, hold_slot: 2, book: 1}
expect:
  invariants: [default]
