id: S06_question_while_card_pending
title: A question while a card is pending gets an answer, the card stays live and is reminded last, and approving still books
category: [conversation]
seed: 6
world:
  book: {forced: [success]}
user:
  persona: cooperative
  goal: {service: plumber, area: Indiranagar, window: this week mornings, budget_max_inr: "1500"}
steps:
  - say: "Book a plumber in Indiranagar for my kitchen tap this week, mornings only, under ₹1,500."
    gives: [service, issue, area, window, budget_max_inr]
  - until: approval_card
  - say: "is that provider verified?"
  - expect_outcome: AWAITING_APPROVAL
  - expect_card: {kind: reminder, status: pending, typed_grant_ok: true}
  - expect_world: {book: 0}
  - approve: {}
  - expect_outcome: BOOKED_VERIFIED
  - expect_world: {book: 1, get_booking_status: 1}
expect:
  invariants: [default]
